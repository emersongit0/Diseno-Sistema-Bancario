{% extends 'base.html' %}
{% block contenido %}<div class="tabs" role="group" aria-label="Tipo de operación"><button class="tab activo" type="button" data-operacion="depositar" aria-pressed="true">Depósito</button><button class="tab" type="button" data-operacion="retirar" aria-pressed="false">Retiro</button><button class="tab" type="button" data-operacion="transferir" aria-pressed="false">Transferencia</button></div><div class="grid-dos grid-igual"><section class="tarjeta"><div class="tarjeta-cabecera"><h2 id="titulo-operacion">Realizar un depósito</h2><span class="badge">SOLES</span></div><form id="form-operacion"><div class="campo"><label for="cuenta-origen" id="etiqueta-cuenta">Cuenta</label><select id="cuenta-origen" required><option value="">Selecciona una cuenta</option></select></div><div class="campo" id="campo-destino" hidden><label for="cuenta-destino">Cuenta de destino</label><select id="cuenta-destino"><option value="">Selecciona una cuenta</option></select></div><div class="campo"><label for="monto">Monto (S/)</label><input id="monto" name="monto" type="number" min="0.01" max="999999999999.99" step="0.01" required placeholder="0.00"></div><div class="form-pie"><button id="confirmar-operacion" type="submit" class="boton">Revisar depósito ↗</button></div></form></section><aside class="tarjeta"><p class="eyebrow">ANTES DE CONFIRMAR</p><h2>Resumen de la operación</h2><div class="resumen-linea"><span>Saldo disponible</span><strong id="saldo-disponible">Selecciona una cuenta</strong></div><div class="resumen-linea"><span>Monto</span><strong id="resumen-monto">S/ 0.00</strong></div><div class="resumen-linea" id="fila-comision" hidden><span>Comisión</span><strong id="comision">—</strong></div><p class="texto-suave" id="etiqueta-total" style="margin-top:20px">Total a depositar</p><p id="total-operacion" class="resumen-total">S/ 0.00</p><p class="texto-suave" style="margin-top:15px" id="nota-operacion">El saldo se actualiza al confirmar la operación.</p><div id="resultado-operacion" style="margin-top:20px" aria-live="polite"></div></aside></div>{% endblock %}
