{% extends 'base.html' %}
{% block acciones %}<button id="nuevo-cliente" type="button" class="boton">+ Nuevo cliente</button>{% endblock %}
{% block contenido %}<div class="barra-herramientas"><div class="campo busqueda"><label for="buscar">Buscar cliente</label><input id="buscar" type="search" placeholder="Nombre, DNI o correo"></div><span id="contador" class="texto-suave"></span></div><div id="tabla-clientes" aria-live="polite"></div>{% endblock %}
{% block modales %}<dialog id="modal-cliente" class="modal" aria-labelledby="titulo-cliente"><div class="modal-top"><h2 id="titulo-cliente">Nuevo cliente</h2><button type="button" class="boton-icono" data-cerrar="modal-cliente" aria-label="Cerrar formulario">×</button></div><form id="form-cliente"><input type="hidden" name="id_cliente"><div class="campo"><label for="dni">DNI</label><input id="dni" name="dni" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" required placeholder="8 dígitos"></div><div class="form-grid"><div class="campo"><label for="nombres">Nombres</label><input id="nombres" name="nombres" maxlength="100" required autocomplete="given-name"></div><div class="campo"><label for="apellidos">Apellidos</label><input id="apellidos" name="apellidos" maxlength="100" required autocomplete="family-name"></div></div><div class="campo"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" maxlength="254" required autocomplete="email"></div><div class="form-pie"><button type="button" class="boton secundario" data-cerrar="modal-cliente">Cancelar</button><button type="submit" class="boton">Guardar cliente</button></div></form></dialog>{% endblock %}
