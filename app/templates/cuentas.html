{% extends 'base.html' %}
{% block acciones %}<button id="nueva-cuenta" type="button" class="boton">+ Abrir cuenta</button>{% endblock %}
{% block contenido %}<div class="barra-herramientas"><p class="texto-suave">Consulta saldos, historial y disponibilidad de tus cuentas.</p><button id="actualizar" class="boton secundario pequeno" type="button">↻ Actualizar</button></div><div id="tabla-cuentas" aria-live="polite"></div>{% endblock %}
{% block modales %}<dialog id="modal-cuenta" class="modal" aria-labelledby="titulo-cuenta"><div class="modal-top"><h2 id="titulo-cuenta">Abrir una cuenta</h2><button type="button" class="boton-icono" data-cerrar="modal-cuenta" aria-label="Cerrar apertura">×</button></div><form id="form-cuenta"><div class="campo"><label for="cliente-cuenta">Titular</label><select name="id_cliente" id="cliente-cuenta" required><option value="">Selecciona un cliente</option></select></div><div class="form-grid"><div class="campo"><label for="tipo-cuenta">Tipo de cuenta</label><select name="tipo" id="tipo-cuenta"><option value="AHORROS">Ahorros</option><option value="CORRIENTE">Corriente</option></select></div><div class="campo"><label for="saldo-inicial">Depósito inicial (S/)</label><input id="saldo-inicial" name="saldo_inicial" type="number" min="0" max="999999999999.99" step="0.01" value="0" required></div></div><div class="campo"><label for="tasa-cuenta">Tasa de interés anual (%) · opcional</label><input id="tasa-cuenta" name="tasa" type="number" min="0" max="999.99" step="0.01" placeholder="Según el tipo de cuenta"><small>Por defecto: ahorros 3.00% · corriente 0.50%.</small></div><div class="form-pie"><button type="button" class="boton secundario" data-cerrar="modal-cuenta">Cancelar</button><button type="submit" class="boton">Abrir cuenta</button></div></form></dialog>{% endblock %}
